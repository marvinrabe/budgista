scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

type Query @middleware(checks: ["auth:api"]) {
  account(id: ID! @eq): Account @find
  accounts: [Account!]! @all
}

type Mutation @middleware(checks: ["auth:api"]) {
  accountCreate(input: AccountSettings!, initialBalance: Int!): Account
  accountUpdate(id: ID!, input: AccountSettings!): Account
}

type Account {
  id: ID!
  name: String!
  balance: Int!
  balanceCleared: Int! @rename(attribute: "balance_cleared")
  icon: String!
  isTracking: Boolean! @rename(attribute: "tracking")
}

input AccountSettings {
  name: String!
  icon: String!
  isTracking: Boolean!
}

type Subscription {
  balanceUpdated: Account
}
