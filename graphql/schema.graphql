scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

type Query @middleware(checks: ["graphql"]) {
  account(id: ID! @eq): Account @find
  accounts: [Account!]! @all
  category(id: ID! @eq): Category @find
  group(id: ID! @eq): Group @find
  groups: [Group!]!
  me: User @auth
  transaction(id: ID! @eq): Transaction @find
  transactions(account: ID! @where(key: "account_id")): [Transaction!]! @paginate
}

type Mutation @middleware(checks: ["graphql"]) {
  categoryCreate(name: String!, groupId: ID): Category
  categoryUpdate(id: ID!, name: String!): Category @update
  categoryDelete(id: ID!, transferToCategoryId: ID): Category
  groupCreate(name: String!): Group @create
  groupUpdate(id: ID!, name: String!): Group @update
  groupDelete(id: ID!): Group @delete
  groupSort(ids: [ID!]!): [Group!]!
  transactionCreate(input: TransactionInput!): [Transaction!]!
  transactionUpdate(id: ID!, input: TransactionInput!): [Transaction!]!
  transactionDelete(id: ID!): Transaction @delete
}

type Group {
  id: ID
  name: String!
  sort: Int!
  categories: [Category!]!
}

type Category {
  id: ID!
  name: String!
  sort: Int!
  group: Group @belongsTo
}

type Transaction {
  id: ID!
  date: Date!
  amount: Int! @method(name: "getAmount")
  from: TransactionSubject
  @with(relation: "account")
  @method(name: "getFromSubject")
  to: TransactionSubject
  @with(relation: "account")
  @method(name: "getToSubject")
  categories: [CategoryAllocation!]!
  @with(relation: "category")
  @method(name: "getCategories")
  recurrence: Recurrence @method(name: "getRecurrence")
}

input TransactionInput {
  date: Date!
  amount: Int!
  from: TransactionSubjectInput!
  to: TransactionSubjectInput!
  categories: [CategoryAllocationInput!]!
  recurrence: RecurrenceInput
}

input TransactionSubjectInput {
  accountId: ID
  payeeName: String
}

input CategoryAllocationInput {
  id: ID!
  amount: Int!
}

input RecurrenceInput {
  interval: Int!
  frequency: Frequency!
}

type Recurrence {
  interval: Int! @method
  frequency: Frequency! @method
}

enum Frequency {
  DAILY
  WEEKLY
  MONTHLY
  YEARLY
}

type TransactionSubject {
  subject: Subject
  cleared: Boolean!
}

type CategoryAllocation {
  category: Category
  amount: Int!
}

interface Subject {
  name: String!
}

type Payee implements Subject {
  name: String!
}

type Account implements Subject {
  id: ID!
  name: String!
  balance: Int!
  balanceCleared: Int! @rename(attribute: "balance_cleared")
  icon: String!
  isTracking: Boolean! @rename(attribute: "tracking")
}

input AccountSettings {
  name: String!
  icon: String!
  isTracking: Boolean!
}

type User {
  email: String!
  locale: String!
  language: String!
  currency: String!
  isVerified: Boolean! @method(name: "hasVerifiedEmail")
}
