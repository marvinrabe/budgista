scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

scalar Date @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\Date")

type Query @middleware(checks: ["auth:api"]) {
  account(id: ID! @eq): Account @find
  accounts: [Account!]! @all
  category(id: ID! @eq): Category @find
  groups: [Group!]!
}

type Mutation @middleware(checks: ["auth:api"]) {
  accountCreate(input: AccountSettings!, initialBalance: Int!): Account
  accountUpdate(id: ID!, input: AccountSettings!): Account
  accountDelete(id: ID!): Account @delete
  categoryCreate(name: String!): Category @create
  categoryUpdate(id: ID!, name: String!): Category @update
  categoryDelete(id: ID!, transferToCategoryId: ID): Category
  groupCreate(name: String!): Group @create
  groupUpdate(id: ID!, name: String!): Group @update
  groupDelete(id: ID!): Group @delete
}

type Group {
  id: ID
  name: String!
  sort: Int!
  categories: [Category!]!
}

type Category {
  id: ID!
  name: String!
  sort: Int!
}

type Account {
  id: ID!
  name: String!
  balance: Int!
  balanceCleared: Int! @rename(attribute: "balance_cleared")
  icon: String!
  isTracking: Boolean! @rename(attribute: "tracking")
}

input AccountSettings {
  name: String!
  icon: String!
  isTracking: Boolean!
}

type Subscription {
  balanceUpdated: Account
}
