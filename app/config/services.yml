# Learn more about services, parameters and containers at
# https://symfony.com/doc/current/service_container.html
parameters:
    #parameter_name: value

services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false

    # makes classes in src/AppBundle available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    AppBundle\:
        resource: '../../src/AppBundle/*'
        # you can exclude directories or files
        # but if a service is unused, it's removed anyway
        exclude: '../../src/AppBundle/{Entity,Repository,Tests}'

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    AppBundle\Controller\:
        resource: '../../src/AppBundle/Controller'
        public: true
        tags: ['controller.service_arguments']

    # add more services, or override services that need manual wiring

    # Repositories
    AppBundle\Repository\AccountRepository:
        class: Doctrine\ORM\EntityRepository
        factory: ['@doctrine.orm.default_entity_manager', getRepository]
        arguments:
            - AppBundle\Entity\Account

    AppBundle\Repository\PayeeRepository:
        class: Doctrine\ORM\EntityRepository
        factory: ['@doctrine.orm.default_entity_manager', getRepository]
        arguments:
            - AppBundle\Entity\Payee

    AppBundle\Repository\CategoryRepository:
        class: Doctrine\ORM\EntityRepository
        factory: ['@doctrine.orm.default_entity_manager', getRepository]
        arguments:
            - AppBundle\Entity\Category

    AppBundle\Repository\TransactionRepository:
        class: Doctrine\ORM\EntityRepository
        factory: ['@doctrine.orm.default_entity_manager', getRepository]
        arguments:
            - AppBundle\Entity\Transaction

    # Tactician Command Bus
    League\Tactician\CommandBus:
        alias: tactician.commandbus.default

    # Remove the following configurations when autoconfig becomes available. See: https://github.com/thephpleague/tactician-bundle/issues/44
    AppBundle\Handler\CreateAccountHandler:
        public: true
        tags:
            - { name: tactician.handler, command: AppBundle\Command\CreateAccountCommand }

    AppBundle\Handler\UpdateAccountSettingsHandler:
        public: true
        tags:
            - { name: tactician.handler, command: AppBundle\Command\UpdateAccountSettingsCommand }

    AppBundle\Handler\CreateCategoryHandler:
        public: true
        tags:
            - { name: tactician.handler, command: AppBundle\Command\CreateCategoryCommand }

    AppBundle\Handler\UpdateCategorySettingsHandler:
        public: true
        tags:
            - { name: tactician.handler, command: AppBundle\Command\UpdateCategorySettingsCommand }

    AppBundle\Handler\CreateTransactionHandler:
        public: true
        tags:
            - { name: tactician.handler, command: AppBundle\Command\CreateTransactionCommand }
