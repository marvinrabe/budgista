version: 2

jobs:
  build:
    working_directory: ~/repo

    docker:
      - image: circleci/php:7.2-cli-node-browsers
      - image: circleci/mysql:5.7

    steps:

      - checkout

      - run:
          name: Install system packages
          command: sudo apt install -y icu-devtools libicu-dev libpng-dev

      - run:
          name: Install PHP extensions
          command: sudo docker-php-ext-install bcmath intl pdo_mysql

      - run:
          name: Setup configuration
          command: cp ./.circleci/.env.testing ./.env

      # Yarn
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - yarn-packages-{{ .Branch }}-{{ checksum "yarn.lock" }}
            - yarn-packages-{{ .Branch }}
            - yarn-packages-master
            - yarn-packages-
      - run:
          name: Install Yarn Dependencies
          command: |
            yarn install
            yarn add full-icu
      - save_cache:
          name: Save Yarn Package Cache
          key: yarn-packages-{{ .Branch }}-{{ checksum "yarn.lock" }}
          paths:
            - node_modules/

      - run:
          name: Test Mocha
          command: |
            export NODE_ICU_DATA=node_modules/full-icu
            npm run test

      # Composer
      - restore_cache:
          name: Restore Composer Package Cache
          keys:
          - v1-dependencies-{{ checksum "composer.lock" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-
      - run:
          name: Install Composer Dependencies
          command: composer install -n --prefer-dist
      - save_cache:
          name: Save Composer Package Cache
          key: v1-dependencies-{{ checksum "composer.lock" }}
          paths:
            - ./vendor

      - run:
          name: Setup keys
          command: |
            php artisan key:generate
            php artisan passport:keys

      - run:
         name: Compile assets
         command: |
           npm run deployment
           if [ "${CIRCLE_BRANCH}" == "master" ]; then
              git config --global user.name "Circle CI"
              git config --global user.email "support@budgista.com"
              git add public/.
              git commit -m "Assets"
           fi

      - run:
          name: Test PHPUnit
          command: vendor/bin/phpunit

      - deploy:
          name: Deploy
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              echo "172.104.149.190 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCfOgLiIHX0TBftsLLGWDGJKBsWUJ1GzBYR1447ktBMnqtxGszGOf9DqHSzPMTPl54OwowahK4vvxM0UQGkXZbI=" >> ~/.ssh/known_hosts
              git remote add dokku dokku@172.104.149.190:app
              git push dokku master --force
            fi