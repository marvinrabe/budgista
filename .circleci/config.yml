version: 2

jobs:
  build:
    working_directory: ~/repo

    docker:
      - image: circleci/php:7.1-cli

      - image: circleci/mysql:5.7

    steps:

      - checkout

      - run:
          name: Install system packages
          command: sudo apt-get update && sudo apt-get -y install icu-devtools libicu-dev

      - run:
          name: Install PHP extensions
          command: sudo docker-php-ext-install bcmath calendar intl pdo_mysql

      - run:
          name: Setup configuration
          command: cp ./.circleci/.env.testing ./.env

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "composer.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run:
          name: Install Composer dependencies
          command: composer install -n --prefer-dist

      - save_cache:
          paths:
            - ./vendor
          key: v1-dependencies-{{ checksum "composer.json" }}

      - run:
          name: Setup environment
          command: |
            php artisan key:generate
            php artisan passport:keys

      - run:
          name: Test
          command: vendor/bin/phpunit

      - deploy:
          name: Deploy
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              echo "172.104.149.190 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCfOgLiIHX0TBftsLLGWDGJKBsWUJ1GzBYR1447ktBMnqtxGszGOf9DqHSzPMTPl54OwowahK4vvxM0UQGkXZbI=" >> ~/.ssh/known_hosts
              git remote add dokku dokku@172.104.149.190:app
              git push dokku master
            fi