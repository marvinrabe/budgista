version: 2

jobs:
  build:
    working_directory: ~/repo

    docker:
      - image: circleci/php:7.1-cli

      - image: circleci/mysql:5.7

    steps:

      - checkout

      - run:
          name: Install system packages
          command: |
            curl -sL https://deb.nodesource.com/setup_8.x | sudo -E bash -
            sudo apt-get update && sudo apt-get -y install nodejs icu-devtools libicu-dev

      - run:
          name: Install PHP extensions
          command: sudo docker-php-ext-install bcmath calendar intl pdo_mysql

      - run:
          name: Setup configuration
          command: cp ./.circleci/.env.testing ./.env

      # Composer
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "composer.lock" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-
      - run:
          name: Install Composer dependencies
          command: composer install -n --prefer-dist
      - save_cache:
          key: v1-dependencies-{{ checksum "composer.lock" }}
          paths:
            - ./vendor

      # NPM
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Install NodeJS Packages
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - ./node_modules

      - run:
          name: Setup keys
          command: |
            php artisan key:generate
            php artisan passport:keys

      - run:
         name: Compile assets
         command: npm run production

      - run:
          name: Test
          command: vendor/bin/phpunit

      - run:
         name: Commit assets
         command: |
          git config --global user.name "Circle CI"
          git config --global user.email "support@budgista.com"
          git add public/.
          git commit -m "Assets"

      - deploy:
          name: Deploy
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              echo "172.104.149.190 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCfOgLiIHX0TBftsLLGWDGJKBsWUJ1GzBYR1447ktBMnqtxGszGOf9DqHSzPMTPl54OwowahK4vvxM0UQGkXZbI=" >> ~/.ssh/known_hosts
              git remote add dokku dokku@172.104.149.190:app
              git push dokku master
            fi